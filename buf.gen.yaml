version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/alecsavvy/clockwise/api
    # Use official CometBFT package
    - file_option: go_package_prefix
      module: buf.build/cometbft/cometbft
      value: github.com/cometbft/cometbft/api
    # Use official DDEX package
    - file_option: go_package_prefix
      module: buf.build/openaudio/ddex
      value: github.com/OpenAudio/ddex-proto/gen
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: api
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: api
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.16.2
    out: api
    opt:
      - paths=source_relative
