syntax = "proto3";
package oap.v1;

import "oap/v1/models/account.proto";
import "oap/v1/models/block.proto";
import "oap/v1/models/transaction.proto";
import "oap/v1/models/ern.proto";
import "oap/v1/models/mead.proto";
import "oap/v1/models/pie.proto";

option go_package = "github.com/alecsavvy/clockwise/api/oap/v1;oapv1";

service OAPService {
  rpc Ping(PingRequest) returns (PingResponse) {}

  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {}
  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsResponse) {}

  rpc GetBlock(GetBlockRequest) returns (GetBlockResponse) {}
  rpc GetBlocks(GetBlocksRequest) returns (GetBlocksResponse) {}

  rpc SendTransaction(SendTransactionRequest) returns (SendTransactionResponse) {}
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {}
  rpc GetTransactions(GetTransactionRequests) returns (GetTransactionResponses) {}

  rpc GetERN(GetERNRequest) returns (GetERNResponse) {}
  rpc GetERNs(GetERNsRequest) returns (GetERNsResponse) {}

  rpc GetMEAD(GetMEADRequest) returns (GetMEADResponse) {}
  rpc GetMEADs(GetMEADsRequest) returns (GetMEADsResponse) {}

  rpc GetPIE(GetPIERequest) returns (GetPIEResponse) {}
  rpc GetPIEs(GetPIEsRequest) returns (GetPIEsResponse) {}
}

// Ping
message PingRequest {}
message PingResponse {
  string message = 1;
}

// Account messages
message GetAccountRequest {
  string address = 1;
}

message GetAccountResponse {
  models.Account account = 1;
}

message GetAccountsRequest {
  repeated string addresses = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message GetAccountsResponse {
  repeated models.Account accounts = 1;
  uint32 total = 2;
}

// Block messages
message GetBlockRequest {
  oneof identifier {
    int64 height = 1;
    string hash = 2;
  }
}

message GetBlockResponse {
  models.Block block = 1;
}

message GetBlocksRequest {
  int64 from_height = 1;
  int64 to_height = 2;
  uint32 limit = 3;
  uint32 offset = 4;
}

message GetBlocksResponse {
  repeated models.Block blocks = 1;
  uint32 total = 2;
}

// Transaction messages
message SendTransactionRequest {
  bytes tx = 1;
}

message SendTransactionResponse {
  string hash = 1;
  uint32 code = 2;
  string log = 3;
}

message GetTransactionRequest {
  string hash = 1;
}

message GetTransactionResponse {
  models.Transaction transaction = 1;
}

message GetTransactionRequests {
  repeated string hashes = 1;
  int64 block_height = 2;
  string address = 3;
  uint32 limit = 4;
  uint32 offset = 5;
}

message GetTransactionResponses {
  repeated models.Transaction transactions = 1;
  uint32 total = 2;
}

// ERN messages
message GetERNRequest {
  string id = 1;
}

message GetERNResponse {
  models.ERN ern = 1;
}

message GetERNsRequest {
  repeated string ids = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message GetERNsResponse {
  repeated models.ERN erns = 1;
  uint32 total = 2;
}

// MEAD messages
message GetMEADRequest {
  string id = 1;
}

message GetMEADResponse {
  models.MEAD mead = 1;
}

message GetMEADsRequest {
  repeated string ids = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message GetMEADsResponse {
  repeated models.MEAD meads = 1;
  uint32 total = 2;
}

// PIE messages
message GetPIERequest {
  string id = 1;
}

message GetPIEResponse {
  models.PIE pie = 1;
}

message GetPIEsRequest {
  repeated string ids = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message GetPIEsResponse {
  repeated models.PIE pies = 1;
  uint32 total = 2;
}
