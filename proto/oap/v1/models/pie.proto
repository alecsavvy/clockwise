syntax = "proto3";
package oap.v1.models;

import "ddex/pie/v10/v10.proto";

option go_package = "github.com/alecsavvy/clockwise/api/oap/v1/models;models";

// PIE with version support
message PIE {
  string id = 1;
  int64 created_at = 2;

  // Support multiple PIE versions (only v10 currently)
  oneof version {
    ddex.pie.v10.PieMessage v10 = 10;
  }
}